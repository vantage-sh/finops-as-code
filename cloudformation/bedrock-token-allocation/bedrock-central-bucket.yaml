# Generated by render_templates.py; edit templates/ and bedrock_demo/lambda_handlers/.
AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Customer-owned central archive for unchanged Bedrock invocation logs.
  Native Vantage enriches from the ORIGINAL source-account buckets.
  The archive and optional KMS key are retained on stack removal.

Parameters:
  CentralBucketName:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
  SourceAccountIds:
    Type: CommaDelimitedList
    Default: ""
    AllowedPattern: "^$|^[0-9]{12}$"
    Description: Fixed source account IDs; leave empty when using SourceOrganizationId.
  SourceOrganizationId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^o-[a-z0-9]{10,32}$"
    Description: Organization allowed to replicate using dedicated roles. Use only for intentional future-account coverage.
  ReplicationRoleNamePrefix:
    Type: String
    Default: bedrock-mil-replication
    AllowedPattern: "^[a-zA-Z0-9+=,.@_-]{1,40}$"
    Description: Exact prefix used by source stacks; source roles append their region.
  EnableKmsEncryption:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Create a retained customer-managed KMS key instead of SSE-S3; incurs key and request charges.
  RetentionDays:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 3650
    Description: Current/noncurrent replica retention from original creation time. Zero disables expiration.

Rules:
  ExactlyOneSourceScope:
    Assertions:
      - Assert: !Or
          - !And [!Equals [!Ref SourceOrganizationId, ""], !Not [!Contains [!Ref SourceAccountIds, ""]]]
          - !And [!Not [!Equals [!Ref SourceOrganizationId, ""]], !EachMemberEquals [!Ref SourceAccountIds, ""]]
        AssertDescription: Choose SourceAccountIds or SourceOrganizationId, never both or neither.

Conditions:
  OrganizationScope: !Not [!Equals [!Ref SourceOrganizationId, ""]]
  UseKms: !Equals [!Ref EnableKmsEncryption, "true"]
  ExpireLogs: !Not [!Equals [!Ref RetentionDays, 0]]

Resources:
  CentralBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref CentralBucketName
      VersioningConfiguration: {Status: Enabled}
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: !If
              - UseKms
              - {SSEAlgorithm: "aws:kms", KMSMasterKeyID: !GetAtt ArchiveKey.Arn}
              - {SSEAlgorithm: AES256}
      LifecycleConfiguration: !If
        - ExpireLogs
        - Rules:
            - Id: BedrockArchiveRetention
              Status: Enabled
              ExpirationInDays: !Ref RetentionDays
              NoncurrentVersionExpiration: {NoncurrentDays: !Ref RetentionDays}
              AbortIncompleteMultipartUpload: {DaysAfterInitiation: 7}
        - !Ref AWS::NoValue

  CentralBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref CentralBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RequireTLS
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt CentralBucket.Arn, !Sub "${CentralBucket.Arn}/*"]
            Condition:
              Bool: {"aws:SecureTransport": "false"}
          - Sid: ReplicateOnlyFromEnrolledRoles
            Effect: Allow
            Principal: !If [OrganizationScope, "*", {AWS: !Ref SourceAccountIds}]
            Action: [s3:ReplicateObject, s3:ReplicateTags]
            Resource:
              - !Sub "${CentralBucket.Arn}/AWSLogs/${!aws:PrincipalAccount}/BedrockModelInvocationLogs/*"
              - !Sub "${CentralBucket.Arn}/*/AWSLogs/${!aws:PrincipalAccount}/BedrockModelInvocationLogs/*"
            Condition:
              StringEquals: !If
                - OrganizationScope
                - {"aws:PrincipalOrgID": !Ref SourceOrganizationId}
                - {"aws:PrincipalAccount": !Ref SourceAccountIds}
              ArnLike: {"aws:PrincipalArn": !Sub "arn:${AWS::Partition}:iam::*:role/${ReplicationRoleNamePrefix}-*"}

  ArchiveKey:
    Type: AWS::KMS::Key
    Condition: UseKms
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Bedrock central archive replication key
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAccountKeyAdministration
            Effect: Allow
            Principal: {AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"}
            Action: kms:*
            Resource: "*"
          - Sid: AllowEnrolledReplicationRoles
            Effect: Allow
            Principal: !If [OrganizationScope, "*", {AWS: !Ref SourceAccountIds}]
            Action: [kms:Encrypt, kms:GenerateDataKey]
            Resource: "*"
            Condition:
              StringEquals: !If
                - OrganizationScope
                - {"aws:PrincipalOrgID": !Ref SourceOrganizationId, "kms:ViaService": !Sub "s3.${AWS::Region}.${AWS::URLSuffix}"}
                - {"aws:PrincipalAccount": !Ref SourceAccountIds, "kms:ViaService": !Sub "s3.${AWS::Region}.${AWS::URLSuffix}"}
              ArnLike: {"aws:PrincipalArn": !Sub "arn:${AWS::Partition}:iam::*:role/${ReplicationRoleNamePrefix}-*"}
              StringLike: {"kms:EncryptionContext:aws:s3:arn": !Sub "arn:${AWS::Partition}:s3:::${CentralBucketName}/*"}

Outputs:
  CentralBucketName:
    Description: Customer archive only; do not connect this bucket to native Vantage.
    Value: !Ref CentralBucket
  CentralBucketArn:
    Value: !GetAtt CentralBucket.Arn
  CentralBucketRegion:
    Value: !Ref AWS::Region
  CentralAccountId:
    Value: !Ref AWS::AccountId
  ReplicationDestinationKmsKeyArn:
    Value: !If [UseKms, !GetAtt ArchiveKey.Arn, ""]
