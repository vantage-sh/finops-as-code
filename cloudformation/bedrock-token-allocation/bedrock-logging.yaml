# Generated by render_templates.py; edit templates/ and bedrock_demo/lambda_handlers/.
AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Enable or safely reuse local Bedrock invocation logging for native Vantage
  enrichment, with optional replication to a customer-owned archive.
  Native Vantage always reads this original bucket, not the replica.

Parameters:
  ExistingLogBucket:
    Type: String
    Default: ""
    Description: Existing bucket to reuse without modifying logging or bucket configuration. Requires LoggingMode=Reuse.
  LogBucketName:
    Type: String
    Default: ""
    Description: Optional name for a new bucket; otherwise bedrock-mil-logs-<account>-<region>.
  LoggingMode:
    Type: String
    Default: Managed
    AllowedValues: [Managed, Reuse]
    Description: Managed creates logging only when absent. Reuse preserves existing logging including CloudWatch and modality settings.
  KeyPrefix:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[^/].*/$"
    Description: Existing or new Bedrock prefix, empty or ending in a slash.
  VantageCrossAccountRole:
    Type: String
    Default: ""
    Description: Active source-account Vantage role name. Empty discovers exactly one matching role; ambiguous matches fail.
  ReplicationDestinationBucketArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:[a-z-]+:s3:::[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    Description: Optional central customer bucket ARN. Existing buckets require an additive replication change in their owning IaC instead.
  ReplicationDestinationAccountId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[0-9]{12}$"
    Description: Account owning the optional central bucket.
  ReplicationDestinationKmsKeyArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:[a-z-]+:kms:[a-z0-9-]+:[0-9]{12}:key/.+$"
    Description: Central stack KMS output. Required for a KMS-encrypted source; key must allow the source replication role.
  LogKmsKeyArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:[a-z-]+:kms:[a-z0-9-]+:[0-9]{12}:key/.+$"
    Description: Optional customer-managed source key ARN. Its owner must grant Bedrock GenerateDataKey and this account's reader/replication roles access.
  ReplicationRoleNamePrefix:
    Type: String
    Default: bedrock-mil-replication
    AllowedPattern: "^[a-zA-Z0-9+=,.@_-]{1,40}$"
    Description: Must match the central stack; the source role name appends this region.
  RetainLoggingOnDelete:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Keep logging on removal. False removes only a configuration created by this stack that has not changed; reused logging is always retained.
  LogRetentionDays:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 3650
    Description: New bucket current and noncurrent version retention. Zero leaves expiration disabled; choose a window covering billing replay.
  EnableReplicationMetrics:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Enable paid CloudWatch replication metrics without Replication Time Control.

Rules:
  ExplicitExistingBucketMode:
    Assertions:
      - Assert: !Or
          - !And [!Equals [!Ref ExistingLogBucket, ""], !Equals [!Ref LoggingMode, Managed]]
          - !And [!Not [!Equals [!Ref ExistingLogBucket, ""]], !Equals [!Ref LoggingMode, Reuse]]
        AssertDescription: Use Managed for a fresh bucket or ExistingLogBucket with LoggingMode=Reuse.
  ExistingBucketsStayCustomerOwned:
    Assertions:
      - Assert: !Or [!Equals [!Ref ExistingLogBucket, ""], !And [!Equals [!Ref ReplicationDestinationBucketArn, ""], !Equals [!Ref LogBucketName, ""]]]
        AssertDescription: Reused buckets cannot receive replication configuration here. Add replication in their owning IaC and leave LogBucketName empty.
  ReplicationDestinationComplete:
    Assertions:
      - Assert: !Or [!Equals [!Ref ReplicationDestinationBucketArn, ""], !Not [!Equals [!Ref ReplicationDestinationAccountId, ""]]]
        AssertDescription: ReplicationDestinationAccountId is required with a replication bucket.
      - Assert: !Or [!Equals [!Ref ReplicationDestinationKmsKeyArn, ""], !Not [!Equals [!Ref ReplicationDestinationBucketArn, ""]]]
        AssertDescription: A destination KMS key requires a replication bucket.
      - Assert: !Or [!Equals [!Ref ReplicationDestinationBucketArn, ""], !Equals [!Ref LogKmsKeyArn, ""], !Not [!Equals [!Ref ReplicationDestinationKmsKeyArn, ""]]]
        AssertDescription: Replicating a KMS-encrypted source requires an explicit destination customer-managed KMS key.
      - Assert: !Or [!Equals [!Ref ReplicationDestinationKmsKeyArn, ""], !Not [!Equals [!Ref LogKmsKeyArn, ""]]]
        AssertDescription: KMS replicas require KMS-encrypted source objects. Set LogKmsKeyArn; a destination KMS default alone does not convert SSE-S3 replicas.

Conditions:
  CreateBucket: !Equals [!Ref ExistingLogBucket, ""]
  NamedBucket: !Not [!Equals [!Ref LogBucketName, ""]]
  DiscoverRole: !Equals [!Ref VantageCrossAccountRole, ""]
  Replicate: !Not [!Equals [!Ref ReplicationDestinationBucketArn, ""]]
  SourceKms: !Not [!Equals [!Ref LogKmsKeyArn, ""]]
  DestinationKms: !Not [!Equals [!Ref ReplicationDestinationKmsKeyArn, ""]]
  ExpireLogs: !Not [!Equals [!Ref LogRetentionDays, 0]]
  ReplicationMetrics: !Equals [!Ref EnableReplicationMetrics, "true"]

Resources:
  LoggingBucket:
    Type: AWS::S3::Bucket
    Condition: CreateBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If [NamedBucket, !Ref LogBucketName, !Sub "bedrock-mil-logs-${AWS::AccountId}-${AWS::Region}"]
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: !If
              - SourceKms
              - {SSEAlgorithm: "aws:kms", KMSMasterKeyID: !Ref LogKmsKeyArn}
              - {SSEAlgorithm: AES256}
      LifecycleConfiguration: !If
        - ExpireLogs
        - Rules:
            - Id: BedrockLogRetention
              Status: Enabled
              ExpirationInDays: !Ref LogRetentionDays
              NoncurrentVersionExpiration: {NoncurrentDays: !Ref LogRetentionDays}
              AbortIncompleteMultipartUpload: {DaysAfterInitiation: 7}
        - !Ref AWS::NoValue
      ReplicationConfiguration: !If
        - Replicate
        - Role: !GetAtt ReplicationRole.Arn
          Rules:
            - Id: BedrockInvocationArchive
              Priority: 1
              Status: Enabled
              DeleteMarkerReplication: {Status: Disabled}
              Filter:
                Prefix: !Sub "${KeyPrefix}AWSLogs/${AWS::AccountId}/BedrockModelInvocationLogs/${AWS::Region}/"
              SourceSelectionCriteria: !If
                - SourceKms
                - SseKmsEncryptedObjects: {Status: Enabled}
                - !Ref AWS::NoValue
              Destination:
                Bucket: !Ref ReplicationDestinationBucketArn
                Account: !Ref ReplicationDestinationAccountId
                StorageClass: STANDARD
                EncryptionConfiguration: !If
                  - DestinationKms
                  - ReplicaKmsKeyID: !Ref ReplicationDestinationKmsKeyArn
                  - !Ref AWS::NoValue
                Metrics: !If
                  - ReplicationMetrics
                  - {Status: Enabled}
                  - !Ref AWS::NoValue
        - !Ref AWS::NoValue

  LoggingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref LoggingBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RequireTLS
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt LoggingBucket.Arn, !Sub "${LoggingBucket.Arn}/*"]
            Condition:
              Bool: {"aws:SecureTransport": "false"}
          - Sid: AllowBedrockLogDelivery
            Effect: Allow
            Principal: {Service: bedrock.amazonaws.com}
            Action: s3:PutObject
            Resource: !Sub "${LoggingBucket.Arn}/${KeyPrefix}AWSLogs/${AWS::AccountId}/BedrockModelInvocationLogs/*"
            Condition:
              StringEquals: {"aws:SourceAccount": !Ref AWS::AccountId}
              ArnLike: {"aws:SourceArn": !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:*"}

  ReplicationRole:
    Type: AWS::IAM::Role
    # Keep ownership when replication is disabled; a retained fixed name cannot be recreated.
    Condition: CreateBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: !Sub "${ReplicationRoleNamePrefix}-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: s3.amazonaws.com}
            Action: sts:AssumeRole
      Policies: !If
        - Replicate
        - - PolicyName: ReplicateBedrockInvocationLogs
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: [s3:GetReplicationConfiguration, s3:ListBucket]
                  Resource: !Sub
                    - "arn:${AWS::Partition}:s3:::${Bucket}"
                    - Bucket: !If [NamedBucket, !Ref LogBucketName, !Sub "bedrock-mil-logs-${AWS::AccountId}-${AWS::Region}"]
                - Effect: Allow
                  Action: [s3:GetObjectVersionForReplication, s3:GetObjectVersionAcl, s3:GetObjectVersionTagging]
                  Resource: !Sub
                    - "arn:${AWS::Partition}:s3:::${Bucket}/${KeyPrefix}AWSLogs/${AWS::AccountId}/BedrockModelInvocationLogs/${AWS::Region}/*"
                    - Bucket: !If [NamedBucket, !Ref LogBucketName, !Sub "bedrock-mil-logs-${AWS::AccountId}-${AWS::Region}"]
                - Effect: Allow
                  Action: [s3:ReplicateObject, s3:ReplicateTags]
                  Resource: !Sub "${ReplicationDestinationBucketArn}/${KeyPrefix}AWSLogs/${AWS::AccountId}/BedrockModelInvocationLogs/${AWS::Region}/*"
                - !If
                  - SourceKms
                  - Effect: Allow
                    Action: kms:Decrypt
                    Resource: !Ref LogKmsKeyArn
                    Condition:
                      StringEquals: {"kms:ViaService": !Sub "s3.${AWS::Region}.${AWS::URLSuffix}"}
                  - !Ref AWS::NoValue
                - !If
                  - DestinationKms
                  - Effect: Allow
                    Action: [kms:Encrypt, kms:GenerateDataKey]
                    Resource: !Ref ReplicationDestinationKmsKeyArn
                  - !Ref AWS::NoValue
        - !Ref AWS::NoValue

  ConfigFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]
      Policies:
        - PolicyName: BedrockLoggingConfig
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [bedrock:GetModelInvocationLoggingConfiguration, bedrock:PutModelInvocationLoggingConfiguration, bedrock:DeleteModelInvocationLoggingConfiguration]
                Resource: "*"
              - Effect: Allow
                Action: iam:ListRoles
                Resource: "*"
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"

  EnableLoggingFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Runtime: python3.13
      Timeout: 120
      Role: !GetAtt ConfigFunctionRole.Arn
      Code:
        ZipFile: |
          from __future__ import annotations

          """Pure ownership and configuration decisions for the logging custom resource."""

          import hashlib

          CONFLICT = ("Bedrock logging already exists. This stack will not overwrite it. Use "
                      "ExistingLogBucket with LoggingMode=Reuse, preserving its prefix and CloudWatch "
                      "configuration.")
          REUSE_MISMATCH = ("Reuse requires existing Bedrock S3 logging at this exact bucket and prefix; "
                            "configure it in its owning IaC first.")


          def logging_destination(config: dict | None) -> tuple[str | None, str]:
              """Return the S3 bucket and normalized prefix in a logging configuration."""
              s3 = (config or {}).get("s3Config") or {}
              return s3.get("bucketName"), s3.get("keyPrefix", "").strip("/")


          def managed_logging_config(bucket: str, prefix: str) -> dict:
              """Return the S3 configuration enabling every supported data-delivery type."""
              s3 = {"bucketName": bucket, **({"keyPrefix": prefix} if prefix else {})}
              return {"s3Config": s3, "textDataDeliveryEnabled": True,
                      "imageDataDeliveryEnabled": True, "embeddingDataDeliveryEnabled": True,
                      "videoDataDeliveryEnabled": True, "audioDataDeliveryEnabled": True}


          def versioned_managed_config(properties: dict) -> dict:
              """Resolve the declared schema while preserving pre-audio resource event behavior."""
              wanted = managed_logging_config(properties["BucketName"], properties.get("KeyPrefix", ""))
              version = str(properties.get("LoggingConfigurationVersion", "1"))
              if version == "2":
                  return wanted
              if version == "1":
                  return {key: value for key, value in wanted.items() if key != "audioDataDeliveryEnabled"}
              raise ValueError("LoggingConfigurationVersion must be 1 or 2.")


          def stack_digest(stack_id: str) -> str:
              """Return the short stable digest that ties a physical ID to its creating stack."""
              return hashlib.sha256(stack_id.encode()).hexdigest()[:32]


          def owned_resource_id(stack_id: str) -> str:
              """Return a stable ownership marker tied to the creating CloudFormation stack."""
              return f"bedrock-mil-managed-{stack_digest(stack_id)}"


          def config_matches_managed(current: dict | None, wanted: dict) -> bool:
              """Return whether the configuration has only the settings this stack manages."""
              actual = dict(current or {})
              if "audioDataDeliveryEnabled" not in wanted and actual.get("audioDataDeliveryEnabled") is False:
                  actual.pop("audioDataDeliveryEnabled")
              if logging_destination(actual) != logging_destination(wanted):
                  return False
              actual["s3Config"] = wanted["s3Config"]
              return actual == wanted


          def retain_on_delete(properties: dict) -> bool:
              """Return whether stack removal must leave the logging configuration in place."""
              return str(properties.get("RetainLoggingOnDelete", "true")).lower() != "false"


          def needs_logging_read(request_type: str, properties: dict, physical_id: str,
                                 stack_id: str) -> bool:
              """Return whether this event can need the current logging configuration."""
              if request_type != "Delete":
                  return True
              return (not retain_on_delete(properties)
                      and properties.get("LoggingMode", "Managed") == "Managed"
                      and physical_id == owned_resource_id(stack_id))


          def logging_change(request_type: str, current: dict | None, properties: dict,
                             old_properties: dict, physical_id: str, stack_id: str) -> dict:
              """Return the safe action and ownership marker without changing any input."""
              bucket, prefix = properties["BucketName"], properties.get("KeyPrefix", "")
              wanted = versioned_managed_config(properties)
              if request_type not in {"Create", "Update", "Delete"}:
                  raise ValueError("Unknown CloudFormation request type.")
              mode = properties.get("LoggingMode", "Managed")
              owned = physical_id == owned_resource_id(stack_id)
              retained_id = physical_id or f"bedrock-mil-reused-{stack_digest(stack_id)}"
              result = {"action": "noop", "physical_id": retained_id, "configuration": wanted}
              if request_type == "Delete":
                  deletable = owned and mode == "Managed" and config_matches_managed(current, wanted)
                  if not retain_on_delete(properties) and deletable:
                      return {**result, "action": "delete"}
                  return result
              if mode == "Reuse":
                  if logging_destination(current) != (bucket, prefix.strip("/")):
                      raise ValueError(REUSE_MISMATCH)
                  return result
              if mode != "Managed":
                  raise ValueError("LoggingMode must be Managed or Reuse.")
              if not current:
                  return {**result, "action": "put", "physical_id": owned_resource_id(stack_id)}
              bucket_owned = str(properties.get("OwnsLogBucket", "false")).lower() == "true"
              if request_type == "Create" and bucket_owned and config_matches_managed(current, wanted):
                  return {**result, "physical_id": owned_resource_id(stack_id)}
              if request_type == "Update" and config_matches_managed(current, wanted):
                  return result
              old_wanted = versioned_managed_config({"BucketName": bucket, **old_properties})
              if owned and config_matches_managed(current, old_wanted):
                  return {**result, "action": "put"}
              raise ValueError(CONFLICT)


          def one_vantage_role(role_names: list[str]) -> str:
              """Return one matching Vantage role or explain how to resolve ambiguous discovery."""
              matches = sorted(name for name in role_names
                               if name.startswith(("ConnectToVantage", "StackSet-ConnectToVantage"))
                               and "-CrossAccountRole-" in name)
              if len(matches) == 1:
                  return matches[0]
              if not matches:
                  raise ValueError("No ConnectToVantage role found. Connect this source account to Vantage "
                                   "or set VantageCrossAccountRole explicitly.")
              raise ValueError(f"Several Vantage roles found: {', '.join(matches)}. Set "
                               "VantageCrossAccountRole to the active integration role.")


          """Thin AWS shell for creating or reusing Bedrock logging safely."""



          def handler(event: dict, context: object) -> None:
              """Apply the ownership-checked operation and answer CloudFormation."""
              import boto3
              import cfnresponse

              properties = event.get("ResourceProperties", {})
              physical_id = event.get("PhysicalResourceId", "")
              fallback_id = physical_id or "bedrock-mil-unowned"
              try:
                  if not needs_logging_read(event["RequestType"], properties, physical_id, event["StackId"]):
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, fallback_id)
                      return
                  client = boto3.client("bedrock")
                  current = client.get_model_invocation_logging_configuration().get("loggingConfig")
                  change = logging_change(event["RequestType"], current, properties,
                                          event.get("OldResourceProperties") or {}, physical_id,
                                          event["StackId"])
                  if change["action"] == "put":
                      client.put_model_invocation_logging_configuration(loggingConfig=change["configuration"])
                  if change["action"] == "delete":
                      client.delete_model_invocation_logging_configuration()
                  cfnresponse.send(event, context, cfnresponse.SUCCESS,
                                   {"Bucket": properties["BucketName"], "Applied": change["action"]},
                                   change["physical_id"])
              except Exception as error:
                  cfnresponse.send(event, context, cfnresponse.FAILED, {}, fallback_id,
                                   reason=str(error)[:900])

  RoleLookupFunction:
    Type: AWS::Lambda::Function
    Condition: DiscoverRole
    Properties:
      Handler: index.handler
      Runtime: python3.13
      Timeout: 120
      Role: !GetAtt ConfigFunctionRole.Arn
      Code:
        ZipFile: |
